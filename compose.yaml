services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-miete}
      MYSQL_USER: ${DOCKER_DB_USER:-miete_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-miete_password}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_password}
    volumes:
      - miete_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${DOCKER_SECRET_KEY:-django-insecure-docker-development-only}
      DEBUG: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0"
      MYSQL: "True"
      DB_NAME: ${DOCKER_DB_NAME:-miete}
      DB_USER: ${DOCKER_DB_USER:-miete_user}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-miete_password}
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

volumes:
  miete_mysql_data: